<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Proyecto</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f1a33;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 2.5rem;
      max-width: 600px;
      width: 100%;
      text-align: center;
    }

    h1 {
      font-size: 2rem;
      color: #38bdf8;
      margin-bottom: 0.5rem;
    }

    p {
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }

    .btn {
      display: inline-block;
      padding: 0.6rem 1.4rem;
      background: #38bdf8;
      color: #0f172a;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      transition: background 0.2s;
    }

    .btn:hover { background: #7dd3fc; }
  </style>
</head>
<body>

  <div class="card">
    <h1>Mi Proyecto</h1>
    <h2>aaaa</h2>
    <p>Bienvenido. Aquí va la descripción de tu proyecto.</p>
    <p>::::::::::::::::::::::::::::::::::::::</p>
    <p> feat ...................</p>
    <p>aaaaaaaaaaaaaaaaa</p>
    <a class="btn" href="#">Ver más</a>
  </div>

</body>
</html>
